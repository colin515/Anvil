name: Import and verify Anvil
on:
  push:
    branches: [main]
    paths: [source.tar.xz.b64]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand complete project
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode source.tar.xz.b64 | tar -xJf -
          rm source.tar.xz.b64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and create lockfile
        run: npm install --no-audit --no-fund
      - name: Commit complete source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Anvil desktop app, AI host and website"
          git push origin HEAD:main
      - name: Run tests
        run: npm run check
      - name: Build desktop frontend
        run: npm run build

  pages:
    needs: hydrate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

  installer:
    needs: hydrate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and unit tests
        run: npm run check
      - name: Package Windows installer
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload Windows setup file
        uses: actions/upload-artifact@v4
        with:
          name: Anvil-Windows-Setup
          path: release/Anvil-Setup.exe
          if-no-files-found: error
      - name: Publish preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0-preview release/Anvil-Setup.exe --repo "${{ github.repository }}" --target main --title "Anvil v0.1.0 Preview" --notes "Early Windows MVP. Requires Ollama. Public hosting uses temporary Cloudflare Quick Tunnels and invite-code access; not for sensitive workloads. Unsigned Windows installer — use at your discretion."
