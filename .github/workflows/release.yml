name: Build local-only Anvil for Windows

on:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anvil-windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out Anvil
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests and typecheck
        run: npm run check
      - name: Verify Electron source syntax
        run: node --check electron/main.cjs
      - name: Package Windows installer
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anvil-Windows-Setup
          path: release/Anvil-Setup.exe
          if-no-files-found: error
      - name: Create or update local-only preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.3.0-lan"
          $file = "release/Anvil-Setup.exe"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $file --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $file --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Anvil v0.3.0 — Private Wi-Fi hosting" --notes "Private Wi-Fi/LAN hosting with optional access codes, real GPU-wide utilization where supported, stop AI + unload, persistent multi-chat browser interface, longer messages, no message quota. Requires Ollama. Allow TCP 3000 on the Private Windows Firewall profile for LAN access. No public internet tunnel. Unsigned Windows preview installer."
          }
