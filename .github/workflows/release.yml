name: Build Anvil Windows installer

on:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anvil-windows-release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out Anvil
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests and typecheck
        run: npm run check
      - name: Verify Electron source syntax
        run: node --check electron/main.cjs
      - name: Package Windows installer
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anvil-Windows-Setup
          path: release/Anvil-Setup.exe
          if-no-files-found: error
      - name: Create or update local-only preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.6.0-studio"
          $file = "release/Anvil-Setup.exe"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $file --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $file --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Anvil v0.6.0 — Mobile Wi-Fi Chat and Studio" --notes "Mobile HTTP chat fix for browsers without crypto.randomUUID, improved small-screen composer, streaming fallback and removed unsupported Thinking selector. Studio tab provides local presentation editing, CSV/TSV/JSON visualizations, diagrams, report export, themes, widgets, project search and metadata-only plugins. Data saved per browser and is not cloud-synced. Full cloud accounts, real-time collaboration and external connectors are not yet implemented. Requires Ollama and an installed local model. Unsigned Windows preview installer."
          }
